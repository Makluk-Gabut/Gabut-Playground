<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ray's Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      resize: none;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.8;
    }

    .output {
      margin-top: 15px;
      font-size: 18px;
    }

    .contact {
      margin-top: 40px;
    }

    a {
      color: #00ffcc;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hi, I'm Ray 👋</h1>
    <p>I build simple tools and websites.</p>

    <h2>Text Formatter</h2>

    <textarea id="inputText" placeholder="type here..."></textarea>
    <br>
    <button onclick="formatText()">Format Text</button>

    <div class="output" id="outputText"></div>

    <div class="contact">
      <h3>Contact Me</h3>
      <p>
        <a href="#">WhatsApp</a> | 
        <a href="#">Email</a>
      </p>
    </div>
  </div>

  <script>
    function formatText() {
      let text = document.getElementById("inputText").value;

      let result = text.toLowerCase().split(" ").map(word => {
        if(word.length === 0) return "";
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(" ");

      document.getElementById("outputText").innerText = result;
    }
  </script>

</body>
</html>
