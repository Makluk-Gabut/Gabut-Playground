<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catur Pro</title>

<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #312e2b;
  color: #fff;
  min-height: 100vh;
  display: flex;
}

#pregame {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.pg-title {
  font-size: 2.2rem;
  color: #81b64c;
  margin-bottom: 20px;
}

.pg-card {
  background: #262421;
  padding: 20px;
  border-radius: 8px;
  margin: 10px 0;
  width: 100%;
  max-width: 400px;
}

.pg-card h3 {
  color: #bababa;
  font-size: 0.9rem;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.btn-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.opt-btn {
  flex: 1;
  padding: 10px;
  background: #312e2b;
  border: 2px solid #403d39;
  color: #bababa;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  min-width: 70px;
}

.opt-btn.active {
  border-color: #81b64c;
  background: #364426;
  color: #fff;
}

.opt-btn:hover {
  border-color: #58544e;
}

.start-btn {
  width: 100%;
  max-width: 400px;
  padding: 14px;
  background: #81b64c;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 20px;
}

.start-btn:hover {
  background: #a3d168;
}

#gamescreen {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.game-container {
  display: flex;
  height: 100vh;
}

.board-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#board {
  width: 500px;
  height: 500px;
  max-width: 90vw;
  max-height: 90vh;
}

.sidebar {
  width: 300px;
  background: #262421;
  border-left: 1px solid #403d39;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  justify-content: center;
}

.btn {
  padding: 8px 14px;
  background: #312e2b;
  border: 1px solid #403d39;
  color: #bababa;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
}

.btn:hover {
  background: #403d39;
}

.player-info {
  text-align: center;
  padding: 10px;
  margin: 5px 0;
  background: #1e1e1c;
  border-radius: 4px;
  font-size: 0.9rem;
}

.clock {
  font-size: 1.5rem;
  font-weight: 700;
  font-family: monospace;
}

.sb-header {
  padding: 12px;
  border-bottom: 1px solid #403d39;
  font-weight: 700;
}

#move-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  font-size: 0.85rem;
  color: #bababa;
}

.move-item {
  padding: 4px 8px;
  margin: 2px 0;
  background: #1e1e1c;
  border-radius: 3px;
}

.sb-controls {
  padding: 12px;
  border-top: 1px solid #403d39;
  display: flex;
  gap: 8px;
}

.sb-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
}

.undo-btn {
  background: #363431;
  color: #fff;
}

.resign-btn {
  background: #5e2e2d;
  color: #ff9999;
}

.sb-btn:hover {
  filter: brightness(1.1);
}

.status {
  text-align: center;
  padding: 10px;
  color: #81b64c;
  font-weight: 600;
}

#modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

#modal-overlay.show {
  display: flex;
}

.modal-box {
  background: #262421;
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid #403d39;
}

.modal-box h2 {
  margin-bottom: 15px;
  color: #81b64c;
}

.pieces-grid {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin: 20px 0;
}

.piece-btn {
  width: 60px;
  height: 60px;
  font-size: 2.5rem;
  border: 2px solid #403d39;
  background: #312e2b;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.piece-btn:hover {
  border-color: #81b64c;
  background: #364426;
}

.modal-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

.modal-btn {
  padding: 12px 24px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
}

.modal-btn.primary {
  background: #81b64c;
  color: #fff;
}

.modal-btn.secondary {
  background: #363431;
  color: #fff;
}

.modal-btn:hover {
  filter: brightness(1.1);
}
</style>
</head>
<body>

<!-- PRE-GAME MENU -->
<div id="pregame">
  <div class="pg-title">♟️ Catur Pro ♟️</div>

  <div class="pg-card">
    <h3>Mode</h3>
    <div class="btn-group">
      <button class="opt-btn active" onclick="setMode('bot')">vs Bot</button>
      <button class="opt-btn" onclick="setMode('friend')">vs Teman</button>
    </div>
  </div>

  <div class="pg-card" id="diff-card">
    <h3>Kesulitan</h3>
    <div class="btn-group">
      <button class="opt-btn" onclick="setDiff('easy')">Easy (600)</button>
      <button class="opt-btn active" onclick="setDiff('normal')">Normal (1500)</button>
      <button class="opt-btn" onclick="setDiff('hard')">Hard (2500)</button>
    </div>
  </div>

  <div class="pg-card" id="time-card">
    <h3>Waktu</h3>
    <div class="btn-group">
      <button class="opt-btn" onclick="setTime(300,0)">5 Min</button>
      <button class="opt-btn" onclick="setTime(600,0)">10 Min</button>
      <button class="opt-btn active" onclick="setTime(900,5)">15|5</button>
      <button class="opt-btn" onclick="setTime(1800,0)">30 Min</button>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">Mulai Game</button>
</div>

<!-- GAME SCREEN -->
<div id="gamescreen">
  <div class="game-container">
    <div class="board-section">
      <div class="top-controls">
        <button class="btn" onclick="goMenu()">← Menu</button>
        <button class="btn" onclick="newGame()">New Game</button>
      </div>
      
      <div id="board"></div>
      
      <div class="status" id="status">White to move</div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-header">Pemain</div>
      
      <div class="player-info">
        <div><strong>Black</strong></div>
        <div class="clock" id="clock-black">15:00</div>
      </div>

      <div class="player-info">
        <div><strong>White (Anda)</strong></div>
        <div class="clock" id="clock-white">15:00</div>
      </div>

      <div class="sb-header" style="margin-top: 15px;">Langkah</div>
      <div id="move-list"></div>

      <div class="sb-controls">
        <button class="sb-btn undo-btn" onclick="undoMove()">Undo</button>
        <button class="sb-btn resign-btn" onclick="resign()">Serah</button>
      </div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-title">Promosi Pion</h2>
    <div class="pieces-grid" id="pieces-grid"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
// ===== STATE =====
let cfg = { mode: 'bot', diff: 'normal', timeBase: 900, inc: 5 };
let game, board;
let clocks = { w: 900, b: 900 };
let clockInterval = null;
let gameActive = false;
let pendingPromo = null;
let botThinking = false;

// ===== UNICODE PIECES =====
const PIECES = {
  'wK': '♔', 'wQ': '♕', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
  'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
};

// ===== PIECE THEME FUNCTION (UNICODE) =====
function getPieceTheme(piece) {
  return PIECES[piece] || '?';
}

// ===== PREGAME CONTROLS =====
function setMode(m) {
  cfg.mode = m;
  document.querySelectorAll('#pregame .btn-group:first-child .opt-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && m === 'bot') || (i === 1 && m === 'friend'));
  });
  document.getElementById('diff-card').style.display = m === 'bot' ? 'block' : 'none';
}

function setDiff(d) {
  cfg.diff = d;
  document.querySelectorAll('#diff-card .opt-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(d.charAt(0).toUpperCase()));
  });
}

function setTime(s, inc) {
  cfg.timeBase = s;
  cfg.inc = inc;
  document.querySelectorAll('#time-card .opt-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(s.toString()));
  });
}

// ===== GAME START =====
function startGame() {
  document.getElementById('pregame').style.display = 'none';
  document.getElementById('gamescreen').style.display = 'flex';
  
  clocks.w = cfg.timeBase;
  clocks.b = cfg.timeBase;
  gameActive = true;
  
  setTimeout(() => {
    try {
      initBoard();
    } catch (e) {
      console.error('Board init error:', e);
      alert('Error initializing board: ' + e.message);
    }
  }, 100);
}

// ===== BOARD INIT =====
function initBoard() {
  if (board) {
    try { board.destroy(); } catch(e) {}
  }
  
  game = new Chess();
  
  // CRITICAL: Wait for DOM to be ready
  const boardEl = document.getElementById('board');
  if (!boardEl) {
    console.error('Board element not found!');
    return;
  }
  
  // Initialize with UNICODE pieces (no CDN dependency)
  try {
    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: getPieceTheme,  // Direct function, not URL
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    });
    
    console.log('Board initialized successfully');
    updateUI();
    startClock();
    
  } catch (e) {
    console.error('Chessboard.js error:', e);
    alert('Failed to init board: ' + e.message);
  }
}

// ===== DRAG & DROP =====
function onDragStart(src, piece, pos, orientation) {
  if (!gameActive || game.game_over() || botThinking) return false;
  if (cfg.mode === 'bot' && game.turn() !== 'w') return false;
  if (piece[0] !== game.turn()) return false;
  return true;
}

function onDrop(src, tgt) {
  if (src === tgt) return 'snapback';
  
  const piece = game.get(src);
  
  // PROMOTION CHECK
  if (piece && piece.type === 'p' && ((piece.color === 'w' && tgt[1] === '8') || (piece.color === 'b' && tgt[1] === '1'))) {
    const moves = game.moves({ verbose: true });
    if (!moves.find(m => m.from === src && m.to === tgt)) return 'snapback';
    
    pendingPromo = { from: src, to: tgt };
    showPromotionModal();
    return 'snapback';
  }
  
  // Normal move
  const move = game.move({ from: src, to: tgt, promotion: 'q' });
  if (!move) return 'snapback';
  
  afterMove();
}

function onSnapEnd() {
  board.position(game.fen());
}

// ===== PROMOTION MODAL =====
function showPromotionModal() {
  const grid = document.getElementById('pieces-grid');
  const pieces = ['q', 'r', 'b', 'n'];
  
  grid.innerHTML = pieces.map(p => {
    const symbol = game.turn() === 'w' 
      ? { q: '♕', r: '♖', b: '♗', n: '♘' }[p]
      : { q: '♛', r: '♜', b: '♝', n: '♞' }[p];
    return `<button class="piece-btn" onclick="choosePromo('${p}')">${symbol}</button>`;
  }).join('');
  
  document.getElementById('modal-overlay').classList.add('show');
}

function choosePromo(piece) {
  document.getElementById('modal-overlay').classList.remove('show');
  if (!pendingPromo) return;
  
  const move = game.move({
    from: pendingPromo.from,
    to: pendingPromo.to,
    promotion: piece
  });
  pendingPromo = null;
  
  if (move) {
    afterMove();
  }
}

// ===== AFTER MOVE =====
function afterMove() {
  board.position(game.fen());
  clocks[game.turn() === 'w' ? 'b' : 'w'] += cfg.inc;
  updateUI();
  
  if (game.game_over()) {
    endGame();
  } else if (cfg.mode === 'bot' && game.turn() === 'b') {
    setTimeout(botMove, 800);
  }
}

// ===== BOT MOVE =====
function botMove() {
  if (!gameActive) return;
  
  botThinking = true;
  const moves = game.moves({ verbose: true });
  
  if (!moves.length) {
    botThinking = false;
    return;
  }
  
  let bestMove;
  
  if (cfg.diff === 'easy') {
    bestMove = moves[Math.floor(Math.random() * moves.length)];
  } else {
    // Simple eval
    const scores = moves.map(m => {
      game.move(m);
      const score = evalPosition();
      game.undo();
      return { move: m, score };
    });
    
    scores.sort((a, b) => b.score - a.score);
    bestMove = scores[0].move;
  }
  
  game.move(bestMove);
  board.position(game.fen());
  clocks.b += cfg.inc;
  botThinking = false;
  updateUI();
  
  if (!game.game_over()) {
    afterMove();
  } else {
    endGame();
  }
}

function evalPosition() {
  if (game.in_checkmate()) return game.turn() === 'w' ? -1000 : 1000;
  if (game.in_draw()) return 0;
  
  const bd = game.board();
  let score = 0;
  const vals = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
  
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = bd[r][c];
      if (p) score += (p.color === 'w' ? 1 : -1) * vals[p.type];
    }
  }
  return score;
}

// ===== CLOCK =====
function startClock() {
  if (clockInterval) clearInterval(clockInterval);
  clockInterval = setInterval(() => {
    const color = game.turn() === 'w' ? 'w' : 'b';
    clocks[color]--;
    if (clocks[color] < 0) {
      gameActive = false;
      endGameMessage(game.turn() === 'w' ? 'Black Wins' : 'White Wins', 'Time out');
    }
    updateUI();
  }, 1000);
}

function stopClock() {
  if (clockInterval) clearInterval(clockInterval);
}

function formatTime(sec) {
  const m = Math.floor(Math.abs(sec) / 60);
  const s = Math.abs(sec) % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// ===== UI UPDATE =====
function updateUI() {
  document.getElementById('clock-white').textContent = formatTime(clocks.w);
  document.getElementById('clock-black').textContent = formatTime(clocks.b);
  
  let status = game.turn() === 'w' ? 'White to move' : 'Black to move';
  if (game.in_check()) status += ' (Check)';
  document.getElementById('status').textContent = status;
  
  const hist = game.history();
  document.getElementById('move-list').innerHTML = hist
    .map((m, i) => `<div class="move-item">${Math.floor(i/2)+1}. ${m}</div>`)
    .join('');
}

// ===== END GAME =====
function endGame() {
  gameActive = false;
  stopClock();
  
  if (game.in_checkmate()) {
    endGameMessage('Checkmate!', game.turn() === 'w' ? 'Black wins' : 'White wins');
  } else if (game.in_draw()) {
    endGameMessage('Draw', 'Game over');
  } else if (game.in_stalemate()) {
    endGameMessage('Stalemate', 'Draw');
  }
}

function endGameMessage(title, desc) {
  const grid = document.getElementById('pieces-grid');
  const btns = document.getElementById('modal-btns');
  
  document.getElementById('modal-title').textContent = title;
  grid.innerHTML = `<div style="text-align:center; color:#81b64c; font-size:1.1rem;">${desc}</div>`;
  btns.innerHTML = `
    <button class="modal-btn primary" onclick="newGame()">Main Lagi</button>
    <button class="modal-btn secondary" onclick="goMenu()">Menu</button>
  `;
  
  document.getElementById('modal-overlay').classList.add('show');
}

// ===== CONTROLS =====
function undoMove() {
  if (game.moves().length === 0) return;
  game.undo();
  if (cfg.mode === 'bot') game.undo();
  board.position(game.fen());
  updateUI();
}

function resign() {
  gameActive = false;
  stopClock();
  endGameMessage('Anda menyerah', game.turn() === 'w' ? 'Black wins' : 'White wins');
}

function newGame() {
  document.getElementById('modal-overlay').classList.remove('show');
  initBoard();
}

function goMenu() {
  gameActive = false;
  stopClock();
  document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('gamescreen').style.display = 'none';
  document.getElementById('pregame').style.display = 'flex';
}

// ===== INIT =====
console.log('Chess game loaded successfully');
</script>
</body>
</html>
