<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catur Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#312e2b;color:#fff;min-height:100vh}button{font:inherit;cursor:pointer}#pregame{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.title{font-size:2.2rem;color:#81b64c;margin-bottom:20px}.card{background:#262421;padding:20px;border-radius:10px;margin:8px 0;width:min(420px,100%)}.card h3{color:#bababa;font-size:.85rem;text-transform:uppercase;margin-bottom:12px}.group{display:flex;gap:8px;flex-wrap:wrap}.option,.start,.control{padding:10px;border:2px solid #403d39;border-radius:7px;background:#312e2b;color:#bababa;font-weight:600}.option{flex:1;min-width:75px}.option.active{border-color:#81b64c;background:#364426;color:#fff}.start{width:min(420px,100%);margin-top:16px;background:#81b64c;color:#fff;border:0;font-size:1.05rem}.start:hover{background:#a3d168}#gamescreen{display:none;min-height:100vh}.layout{display:flex;min-height:100vh;max-width:1200px;margin:auto}.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}.top{width:min(560px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.control{padding:7px 12px;font-size:.85rem}.control:hover{background:#403d39;color:#fff}.player{width:min(560px,100%);display:flex;justify-content:space-between;align-items:center;background:#262421;border:1px solid #403d39;border-radius:6px;padding:8px 12px;margin:4px 0}.clock{font:700 1.3rem monospace;background:#1e1e1c;padding:6px 12px;border-radius:4px}.active .clock{background:#fff;color:#000}.board{width:min(560px,92vw);height:min(560px,92vw);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);box-shadow:0 8px 24px #0008;border-radius:4px;overflow:hidden}.square{border:0;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif;font-size:clamp(1.8rem,7vw,4rem);line-height:1;user-select:none;position:relative}.light{background:#eeeed2}.dark{background:#769656}.square.selected{box-shadow:inset 0 0 0 5px #f5f682}.square.target::after{content:"";width:24%;height:24%;border-radius:50%;background:#81b64caa;position:absolute}.square.capture::after{content:"";position:absolute;inset:7%;border:5px solid #81b64caa;border-radius:50%}.piece{position:relative;z-index:1;text-shadow:1px 2px 2px #0008}.status{min-height:25px;margin:7px;color:#bababa;font-weight:600}.sidebar{width:300px;background:#262421;border-left:1px solid #403d39;display:flex;flex-direction:column}.sidehead{padding:14px;border-bottom:1px solid #403d39;font-weight:700}.moves{flex:1;overflow:auto;padding:8px;color:#ddd}.move{padding:5px 8px;background:#1e1e1c;margin:2px 0;border-radius:3px}.sidebuttons{display:flex;gap:8px;padding:12px;border-top:1px solid #403d39}.sidebuttons button{flex:1;border:0;border-radius:6px;padding:10px;font-weight:bold}.undo{background:#363431;color:#fff}.resign{background:#5e2e2d;color:#ff9999}.overlay{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;z-index:5}.overlay.show{display:flex}.dialog{background:#262421;border:1px solid #403d39;border-radius:12px;padding:25px;text-align:center}.dialog h2{color:#81b64c;margin-bottom:15px}.promo{display:flex;gap:12px;justify-content:center}.promo button{width:60px;height:60px;font-size:2.5rem;background:#312e2b;color:#fff;border:2px solid #403d39;border-radius:8px}.promo button:hover{border-color:#81b64c}@media(max-width:760px){.layout{display:block}.main{min-height:calc(100vh - 300px)}.sidebar{width:100%;height:300px;border-left:0;border-top:1px solid #403d39}.board{width:92vw;height:92vw}}
</style>
</head>
<body>
<div id="pregame"><div class="title">♟ Catur Pro ♟</div><div class="card"><h3>Mode</h3><div class="group"><button class="option active" data-mode="bot">vs Bot</button><button class="option" data-mode="friend">vs Teman</button></div></div><div class="card" id="diff-card"><h3>Kesulitan Bot</h3><div class="group"><button class="option" data-diff="easy">Easy</button><button class="option active" data-diff="normal">Normal</button><button class="option" data-diff="hard">Hard</button></div></div><div class="card"><h3>Kontrol Waktu</h3><div class="group"><button class="option" data-time="300">5 Min</button><button class="option" data-time="600">10 Min</button><button class="option active" data-time="900" data-inc="5">15|5</button><button class="option" data-time="1800">30 Min</button></div></div><button class="start" id="start">Mulai Game</button></div>
<div id="gamescreen"><div class="layout"><main class="main"><div class="top"><button class="control" id="menu">← Menu</button><strong style="color:#81b64c">Catur Pro</strong><button class="control" id="new">Baru</button></div><div class="player" id="blackbar"><span>Hitam / Bot</span><span class="clock" id="blackclock">15:00</span></div><div class="board" id="board" aria-label="Papan catur"></div><div class="player" id="whitebar"><span>Putih / Anda</span><span class="clock" id="whiteclock">15:00</span></div><div class="status" id="status">Giliran: Putih</div></main><aside class="sidebar"><div class="sidehead">Riwayat Langkah</div><div class="moves" id="moves"></div><div class="sidebuttons"><button class="undo" id="undo">Undo</button><button class="resign" id="resign">Menyerah</button></div></aside></div></div>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="dialog-title">Promosi Pion</h2><div class="promo" id="promo"></div><button class="control" id="close-dialog" style="margin-top:15px">Tutup</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
'use strict';
const ICON={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
let cfg={mode:'bot',diff:'normal',time:900,inc:5},game=null,selected=null,pending=null,timer=null,active=false,thinking=false;
const $=id=>document.getElementById(id);
function selectButtons(selector, value, attr){document.querySelectorAll(selector).forEach(b=>b.classList.toggle('active',b.dataset[attr]===String(value)))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;selectButtons('[data-mode]',cfg.mode,'mode');$('diff-card').style.display=cfg.mode==='bot'?'block':'none'});
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{cfg.diff=b.dataset.diff;selectButtons('[data-diff]',cfg.diff,'diff')});
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{cfg.time=Number(b.dataset.time);cfg.inc=Number(b.dataset.inc||0);document.querySelectorAll('[data-time]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
$('start').onclick=startGame;$('menu').onclick=goMenu;$('new').onclick=()=>initGame();$('undo').onclick=undoMove;$('resign').onclick=()=>finish('Menyerah','Anda menyerah.');$('close-dialog').onclick=closeOverlay;
function startGame(){$('pregame').style.display='none';$('gamescreen').style.display='block';initGame()}
function initGame(){clearInterval(timer);game=new Chess();active=true;thinking=false;selected=null;pending=null;cfg.mode==='bot'?null:null;render();startClock()}
function render(){renderBoard();renderMoves();updateInfo()}
function renderBoard(){const el=$('board');el.innerHTML='';const rows=game.board();rows.forEach((row,r)=>row.forEach((p,c)=>{const sq=String.fromCharCode(97+c)+(8-r),cell=document.createElement('button');cell.className='square '+((r+c)%2?'dark':'light');cell.dataset.square=sq;cell.type='button';if(selected===sq)cell.classList.add('selected');if(selected){const moves=game.moves({square:selected,verbose:true});const m=moves.find(x=>x.to===sq);if(m)cell.classList.add(p?'capture':'target')}if(p){const span=document.createElement('span');span.className='piece';span.textContent=ICON[p.color][p.type];cell.appendChild(span)}cell.onclick=()=>clickSquare(sq);cell.ondragover=e=>e.preventDefault();cell.ondrop=e=>{e.preventDefault();if(selected)movePiece(selected,sq)};if(p){cell.draggable=true;cell.ondragstart=()=>{if(canSelect(sq)){selected=sq;renderBoard()}}}el.appendChild(cell)}))}
function canSelect(sq){if(!active||thinking||game.game_over())return false;const p=game.get(sq);return !!p&&p.color===game.turn()&&(cfg.mode==='friend'||game.turn()==='w')}
function clickSquare(sq){if(!active||thinking)return;const p=game.get(sq);if(selected){if(selected===sq){selected=null;renderBoard();return}const legal=game.moves({square:selected,verbose:true}).find(m=>m.to===sq);if(legal){if(legal.promotion){pending={from:selected,to:sq};showPromotion(game.turn())}else movePiece(selected,sq);return}if(canSelect(sq)){selected=sq;renderBoard();return}selected=null;renderBoard()}else if(canSelect(sq)){selected=sq;renderBoard()}}
function movePiece(from,to,promotion='q'){const move=game.move({from,to,promotion});selected=null;if(!move){renderBoard();return}afterMove()}
function showPromotion(color){$('promo').innerHTML='';const chars=color==='w'?['♕','♖','♗','♘']:['♛','♜','♝','♞'];['q','r','b','n'].forEach((p,i)=>{const b=document.createElement('button');b.textContent=chars[i];b.onclick=()=>{closeOverlay();if(pending){movePiece(pending.from,pending.to,p);pending=null}};$('promo').appendChild(b)});$('dialog-title').textContent='Promosi Pion';$('close-dialog').style.display='block';$('overlay').classList.add('show')}
function afterMove(){render();if(game.game_over()){endGame();return}if(cfg.mode==='bot'&&game.turn()==='b'){thinking=true;$('status').textContent='Bot sedang berpikir...';setTimeout(botMove,cfg.diff==='easy'?350:cfg.diff==='hard'?1000:650)}}
function botMove(){if(!active||game.turn()!=='b')return;const moves=game.moves({verbose:true});if(!moves.length)return;let chosen;if(cfg.diff==='easy')chosen=moves[Math.floor(Math.random()*moves.length)];else{let best=-Infinity;for(const m of moves){game.move(m);const score=positionScore();game.undo();if(score>best){best=score;chosen=m}}}game.move(chosen);thinking=false;render();if(game.game_over())endGame()}
function positionScore(){if(game.in_checkmate())return game.turn()==='w'?-10000:10000;let s=0,v={p:1,n:3,b:3,r:5,q:9,k:0};game.board().forEach(row=>row.forEach(p=>{if(p)s+=(p.color==='b'?1:-1)*v[p.type]}));return s}
function renderMoves(){const h=game.history();$('moves').innerHTML=h.map((m,i)=>`<div class="move">${i%2===0?Math.floor(i/2+1)+'. ':''}${m}</div>`).join('');$('moves').scrollTop=$('moves').scrollHeight}
function updateInfo(){const turn=game.turn()==='w'?'Putih':'Hitam';$('status').textContent=game.in_check()?`Giliran: ${turn} (Skak)`:`Giliran: ${turn}`;$('whiteclock').textContent=format(cfg.w);$('blackclock').textContent=format(cfg.b);$('whitebar').classList.toggle('active',game.turn()==='w');$('blackbar').classList.toggle('active',game.turn()==='b')}
function format(n){return Math.floor(Math.max(0,n)/60)+':'+String(Math.max(0,n)%60).padStart(2,'0')}
function startClock(){clearInterval(timer);timer=setInterval(()=>{if(!active||!game)return;const c=game.turn();cfg[c]--;if(cfg[c]<=0){cfg[c]=0;finish(c==='w'?'Hitam menang':'Putih menang','Waktu habis.')}updateInfo()},1000);updateInfo()}
function undoMove(){if(!game||!game.history().length)return;game.undo();if(cfg.mode==='bot'&&game.history().length)game.undo();thinking=false;selected=null;render();}
function endGame(){if(game.in_checkmate())finish(game.turn()==='w'?'Hitam menang':'Putih menang','Skakmat.');else if(game.in_draw()||game.in_stalemate())finish('Seri','Permainan berakhir seri.')}
function finish(title,desc){active=false;thinking=false;clearInterval(timer);$('dialog-title').textContent=title;$('promo').innerHTML=`<div style="color:#bababa;padding:10px">${desc}</div><div><button class="control" onclick="initGame()">Main Lagi</button><button class="control" onclick="goMenu()">Menu</button></div>`;$('close-dialog').style.display='none';$('overlay').classList.add('show')}
function closeOverlay(){if(pending){pending=null;selected=null;$('overlay').classList.remove('show');renderBoard();return}$('overlay').classList.remove('show')}
function goMenu(){active=false;thinking=false;clearInterval(timer);$('overlay').classList.remove('show');$('gamescreen').style.display='none';$('pregame').style.display='flex'}
</script>
</body>
</html>
