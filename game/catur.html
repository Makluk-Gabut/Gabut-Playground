<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catur Pro</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;color:#f8fafc;min-height:100vh}

/* ===== PRE-GAME ===== */
#pregame{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 20px}
.pg-title{font-size:2.5rem;font-weight:800;color:#38bdf8;margin-bottom:4px;text-align:center}
.pg-sub{color:#64748b;margin-bottom:30px;font-size:1rem}
.pg-card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;width:100%;max-width:480px;margin-bottom:16px}
.pg-card h3{font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:#64748b;margin-bottom:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.opt-btn{flex:1;padding:10px 12px;background:#0f172a;border:2px solid #334155;border-radius:10px;color:#94a3b8;font-size:.95rem;cursor:pointer;transition:.2s;white-space:nowrap;min-width:0}
.opt-btn.active{border-color:#38bdf8;color:#38bdf8;background:#0c1e35}
.opt-btn:hover{border-color:#475569;color:#f8fafc}
#steal-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;background:#0f172a;border-radius:10px;border:1px solid #334155}
.toggle{width:44px;height:24px;background:#334155;border-radius:12px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:#0ea5e9}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.toggle.on::after{left:23px}
#steal-label{font-size:.9rem;color:#94a3b8;line-height:1.4}
.start-btn{width:100%;max-width:480px;padding:16px;background:linear-gradient(135deg,#0ea5e9,#6366f1);border:none;border-radius:12px;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.5px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(14,165,233,.4)}

/* ===== GAME SCREEN ===== */
#gamescreen{display:none;height:100vh;overflow:hidden}
.game-wrap{display:flex;height:100vh}
.board-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;min-width:0}
.sidebar{width:280px;background:#1e293b;border-left:2px solid #334155;display:flex;flex-direction:column;overflow:hidden}

/* top bar */
.top-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#0f172a;border-bottom:1px solid #334155}
.back-btn{background:none;border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.back-btn:hover{border-color:#38bdf8;color:#38bdf8}
.top-title{font-weight:700;color:#38bdf8;font-size:1rem;flex:1;text-align:center}
.new-btn{background:#0ea5e9;border:none;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.new-btn:hover{background:#0284c7}

/* player bar */
.player-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:480px;padding:10px 14px;background:#1e293b;border-radius:10px;margin:6px 0}
.player-bar.active-turn{border:2px solid #38bdf8;background:#0c1e35}
.player-info{display:flex;align-items:center;gap:8px}
.player-dot{width:14px;height:14px;border-radius:50%;border:2px solid #475569}
.player-dot.white-dot{background:#f1f5f9}
.player-dot.black-dot{background:#1e293b;border-color:#94a3b8}
.player-name-label{font-weight:600;font-size:.95rem}
.player-elo{font-size:.75rem;color:#64748b}
.clock{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:#f8fafc;background:#0f172a;padding:6px 12px;border-radius:8px;letter-spacing:1px}
.clock.low-time{color:#ef4444;animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.6}}

/* board wrapper */
#board{width:480px}
@media(max-width:700px){#board{width:90vw}}

.status-text{font-size:.9rem;font-weight:600;color:#38bdf8;min-height:24px;text-align:center;margin:6px 0}

/* sidebar */
.sb-header{padding:14px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
.sb-header span{font-weight:700;color:#f8fafc;font-size:.95rem}
.turn-badge{font-size:.75rem;padding:4px 10px;border-radius:20px;background:#0ea5e9;color:#fff;font-weight:600}
.sb-info{padding:10px 16px;border-bottom:1px solid #1e293b;font-size:.82rem;color:#64748b}
#move-list{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:24px 1fr 1fr;gap:2px;align-content:start}
#move-list::-webkit-scrollbar{width:4px}
#move-list::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.move-num{font-size:.78rem;color:#475569;display:flex;align-items:center;padding:2px 4px}
.move-cell{font-size:.85rem;padding:4px 8px;border-radius:6px;color:#cbd5e1;cursor:default}
.move-cell.last-move{background:#0c1e35;color:#38bdf8}
.sb-controls{padding:12px 16px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:8px}
.undo-btn{background:#334155;border:none;color:#f8fafc;border-radius:8px;padding:10px;cursor:pointer;font-size:.9rem;transition:.2s}
.undo-btn:hover{background:#475569}
.resign-btn{background:#7f1d1d;border:none;color:#fca5a5;border-radius:8px;padding:10px;cursor:pointer;font-size:.9rem;transition:.2s}
.resign-btn:hover{background:#991b1b}

/* highlight squares */
.highlight-from{background:rgba(247,247,105,.5)!important}
.highlight-to{background:rgba(247,247,105,.5)!important}

/* promotion modal */
#promo-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center}
#promo-modal.show{display:flex}
.promo-box{background:#1e293b;border:2px solid #334155;border-radius:16px;padding:24px;text-align:center}
.promo-box h3{margin-bottom:16px;color:#f8fafc}
.promo-pieces{display:flex;gap:12px;justify-content:center}
.promo-piece{font-size:2.5rem;cursor:pointer;padding:8px;border-radius:10px;border:2px solid #334155;background:#0f172a;transition:.2s}
.promo-piece:hover{border-color:#38bdf8;background:#0c1e35}

/* result overlay */
#result-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:900;align-items:center;justify-content:center}
#result-overlay.show{display:flex}
.result-box{background:#1e293b;border:2px solid #334155;border-radius:20px;padding:32px;text-align:center;max-width:320px;width:90%}
.result-box h2{font-size:1.8rem;margin-bottom:8px;color:#38bdf8}
.result-box p{color:#94a3b8;margin-bottom:24px}
.result-btns{display:flex;flex-direction:column;gap:10px}
.r-btn{padding:12px;border-radius:10px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s}
.r-btn.primary{background:#0ea5e9;color:#fff}
.r-btn.secondary{background:#334155;color:#f8fafc}
.r-btn:hover{filter:brightness(1.1)}

/* check highlight */
.check-sq{background:radial-gradient(ellipse at center,rgba(239,68,68,.9) 0%,rgba(239,68,68,0) 70%)!important}
</style>
</head>
<body>

<!-- PRE-GAME -->
<div id="pregame">
  <div class="pg-title">♟️ Catur Pro</div>
  <div class="pg-sub">Pilih pengaturan permainan</div>

  <div class="pg-card">
    <h3>Mode Permainan</h3>
    <div class="btn-group">
      <button class="opt-btn active" id="mode-bot" onclick="setMode('bot')">🤖 vs Bot</button>
      <button class="opt-btn" id="mode-friend" onclick="setMode('friend')">👥 vs Teman</button>
    </div>
  </div>

  <div class="pg-card" id="diff-card">
    <h3>Kesulitan Bot</h3>
    <div class="btn-group">
      <button class="opt-btn" id="diff-easy" onclick="setDiff('easy')">🟢 Easy<br><small style="color:#64748b">ELO ~600</small></button>
      <button class="opt-btn active" id="diff-normal" onclick="setDiff('normal')">🟡 Normal<br><small style="color:#64748b">ELO ~1500</small></button>
      <button class="opt-btn" id="diff-hard" onclick="setDiff('hard')">🔴 Hard<br><small style="color:#64748b">ELO ~2500</small></button>
    </div>
    <div id="steal-row">
      <div class="toggle" id="steal-toggle" onclick="toggleSteal()"></div>
      <span id="steal-label">
        <strong style="color:#f8fafc">Steal Timer</strong><br>
        Bot mencuri waktu dari jam kamu saat bergerak
      </span>
    </div>
  </div>

  <div class="pg-card">
    <h3>Kontrol Waktu</h3>
    <div class="btn-group">
      <button class="opt-btn" onclick="setTime(3600,0)" id="t-3600">1 Jam</button>
      <button class="opt-btn" onclick="setTime(1800,0)" id="t-1800">30 Min</button>
      <button class="opt-btn active" onclick="setTime(900,5)" id="t-900">15|5</button>
      <button class="opt-btn" onclick="setTime(600,0)" id="t-600">10 Min</button>
      <button class="opt-btn" onclick="setTime(300,0)" id="t-300">5 Min</button>
      <button class="opt-btn" onclick="setTime(180,2)" id="t-180">3|2</button>
      <button class="opt-btn" onclick="setTime(120,0)" id="t-120">2 Min</button>
      <button class="opt-btn" onclick="setTime(60,1)" id="t-60">1|1</button>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">▶ Mulai Permainan</button>
</div>

<!-- GAME SCREEN -->
<div id="gamescreen">
  <div class="game-wrap">
    <div class="board-col">
      <div class="top-bar" style="width:100%;max-width:480px;border-radius:10px 10px 0 0">
        <button class="back-btn" onclick="goMenu()">← Menu</button>
        <span class="top-title">♟️ Catur Pro</span>
        <button class="new-btn" onclick="newGame()">↺ Baru</button>
      </div>

      <div class="player-bar" id="bar-black">
        <div class="player-info">
          <div class="player-dot black-dot"></div>
          <div>
            <div class="player-name-label" id="black-label">Hitam</div>
            <div class="player-elo" id="black-elo"></div>
          </div>
        </div>
        <div class="clock" id="clock-black">—</div>
      </div>

      <div id="board"></div>

      <div class="player-bar" id="bar-white">
        <div class="player-info">
          <div class="player-dot white-dot"></div>
          <div>
            <div class="player-name-label" id="white-label">Putih</div>
            <div class="player-elo" id="white-elo"></div>
          </div>
        </div>
        <div class="clock" id="clock-white">—</div>
      </div>

      <div class="status-text" id="status-msg">Giliran: Putih</div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-header">
        <span>📋 Riwayat Langkah</span>
        <div class="turn-badge" id="turn-badge">Putih</div>
      </div>
      <div class="sb-info" id="sb-info">—</div>
      <div id="move-list"></div>
      <div class="sb-controls">
        <button class="undo-btn" onclick="undoMove()">↩ Undo Langkah</button>
        <button class="resign-btn" onclick="resign()">🏳️ Menyerah</button>
      </div>
    </div>
  </div>
</div>

<!-- Promotion modal -->
<div id="promo-modal">
  <div class="promo-box">
    <h3>Promosi Pion — Pilih Bidak</h3>
    <div class="promo-pieces">
      <div class="promo-piece" onclick="doPromotion('q')" title="Ratu">♛</div>
      <div class="promo-piece" onclick="doPromotion('r')" title="Benteng">♜</div>
      <div class="promo-piece" onclick="doPromotion('b')" title="Gajah">♝</div>
      <div class="promo-piece" onclick="doPromotion('n')" title="Kuda">♞</div>
    </div>
  </div>
</div>

<!-- Result overlay -->
<div id="result-overlay">
  <div class="result-box">
    <h2 id="result-title">♟️</h2>
    <p id="result-desc"></p>
    <div class="result-btns">
      <button class="r-btn primary" onclick="newGame()">Main Lagi</button>
      <button class="r-btn secondary" onclick="goMenu()">← Menu</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script>
// ===== STATE =====
let cfg = { mode:'bot', diff:'normal', timeBase:900, inc:5, steal:false, timeId:'t-900' };
let game, board;
let clocks = { w:900, b:900 };
let clockTick = null;
let pendingPromo = null;
let botThinking = false;
let moveCount = 0;
let gameActive = false;

// ===== PREGAME UI =====
function setMode(m) {
  cfg.mode = m;
  document.getElementById('mode-bot').classList.toggle('active', m==='bot');
  document.getElementById('mode-friend').classList.toggle('active', m==='friend');
  document.getElementById('diff-card').style.display = m==='bot' ? '' : 'none';
}
function setDiff(d) {
  cfg.diff = d;
  ['easy','normal','hard'].forEach(x => document.getElementById('diff-'+x).classList.toggle('active', x===d));
}
function setTime(s, inc) {
  cfg.timeBase = s; cfg.inc = inc;
  document.querySelectorAll('.pg-card .opt-btn[id^=t-]').forEach(b => b.classList.remove('active'));
  const id = 't-'+s;
  if (document.getElementById(id)) document.getElementById(id).classList.add('active');
}
function toggleSteal() {
  cfg.steal = !cfg.steal;
  document.getElementById('steal-toggle').classList.toggle('on', cfg.steal);
}

// ===== START =====
function startGame() {
  clocks.w = cfg.timeBase; clocks.b = cfg.timeBase;
  document.getElementById('pregame').style.display = 'none';
  document.getElementById('gamescreen').style.display = '';

  // Labels
  const isBot = cfg.mode === 'bot';
  document.getElementById('white-label').textContent = 'Putih (Kamu)';
  document.getElementById('black-label').textContent = isBot ? 'Bot' : 'Hitam';
  const eloMap = { easy:'ELO ~600', normal:'ELO ~1500', hard:'ELO ~2500' };
  document.getElementById('black-elo').textContent = isBot ? eloMap[cfg.diff] : '';
  document.getElementById('white-elo').textContent = '';
  document.getElementById('sb-info').textContent = isBot
    ? `Mode: Bot ${cfg.diff.charAt(0).toUpperCase()+cfg.diff.slice(1)} ${cfg.steal?'| Steal Timer ✓':''}`
    : 'Mode: 2 Pemain';

  initBoard();
}

function initBoard() {
  if (board) board.destroy();
  game = new Chess();
  moveCount = 0;
  botThinking = false;
  gameActive = true;

  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/img/chesspieces/wikipedia/{piece}.png',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd
  });

  clocks.w = cfg.timeBase; clocks.b = cfg.timeBase;
  updateClockUI();
  updateStatus();
  renderMoves();
  clearHighlights();
  stopClock();

  // Start clock on first move so start game immediately
  startClockFor('w');
}

// ===== BOARD EVENTS =====
function onDragStart(src, piece) {
  if (!gameActive) return false;
  if (game.game_over()) return false;
  if (botThinking) return false;
  if (cfg.mode === 'bot' && game.turn() !== 'w') return false;
  if (piece.search(/^b/) !== -1 && game.turn() === 'w') return false;
  if (piece.search(/^w/) !== -1 && game.turn() === 'b') return false;
  return true;
}

function onDrop(src, tgt) {
  removeHighlights();
  if (src === tgt) return 'snapback';

  // Check promotion
  const piece = game.get(src);
  if (piece && piece.type === 'p') {
    const promRank = piece.color === 'w' ? '8' : '1';
    if (tgt[1] === promRank) {
      const moves = game.moves({ verbose: true });
      const valid = moves.find(m => m.from === src && m.to === tgt);
      if (!valid) return 'snapback';
      pendingPromo = { from: src, to: tgt };
      document.getElementById('promo-modal').classList.add('show');
      return 'snapback';
    }
  }

  const move = tryMove(src, tgt, 'q');
  if (move === null) return 'snapback';

  afterHumanMove(src, tgt);
}

function onSnapEnd() { board.position(game.fen()); }

function tryMove(from, to, promo) {
  return game.move({ from, to, promotion: promo });
}

function doPromotion(piece) {
  document.getElementById('promo-modal').classList.remove('show');
  if (!pendingPromo) return;
  const { from, to } = pendingPromo;
  pendingPromo = null;
  const move = tryMove(from, to, piece);
  if (!move) return;
  board.position(game.fen());
  afterHumanMove(from, to);
}

function afterHumanMove(from, to) {
  addIncrementTo(game.turn() === 'w' ? 'b' : 'w'); // increment for the side that just moved
  highlightMove(from, to);
  updateAll();
  if (!game.game_over()) {
    switchClock();
    if (cfg.mode === 'bot') scheduleBotMove();
  } else {
    endGame();
  }
}

// ===== BOT =====
function scheduleBotMove() {
  if (botThinking) return;
  botThinking = true;
  document.getElementById('status-msg').textContent = '🤖 Bot sedang berpikir...';
  const delay = cfg.diff === 'easy' ? 400 : cfg.diff === 'normal' ? 700 : 1000;
  setTimeout(() => {
    if (!gameActive) { botThinking = false; return; }
    const move = getBotMove();
    if (!move) { botThinking = false; return; }
    game.move(move);
    board.position(game.fen());
    addIncrementTo('b');

    if (cfg.steal) {
      const steal = Math.max(1, Math.min(10, Math.floor(clocks.w * 0.05)));
      clocks.w = Math.max(0, clocks.w - steal);
    }

    highlightMove(move.from, move.to);
    botThinking = false;
    updateAll();
    if (!game.game_over()) {
      switchClock();
    } else {
      endGame();
    }
  }, delay);
}

// ===== AI ENGINE =====
const PIECE_VAL = { p:100, n:320, b:330, r:500, q:900, k:20000 };

const PST = {
  p:[ 0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0 ],
  n:[ -50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50 ],
  b:[ -20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20 ],
  r:[ 0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0 ],
  q:[ -20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20 ],
  k:[ -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20 ]
};

function evalBoard() {
  if (game.in_checkmate()) return game.turn()==='w' ? -99999 : 99999;
  if (game.in_draw()) return 0;
  const bd = game.board();
  let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = bd[r][c];
      if (!p) continue;
      const v = PIECE_VAL[p.type];
      const idx = p.color==='w' ? r*8+c : (7-r)*8+c;
      const pst = PST[p.type][idx];
      score += p.color==='w' ? v+pst : -(v+pst);
    }
  }
  return score;
}

let searchStart;
function minimax(depth, alpha, beta, isMax) {
  if (Date.now() - searchStart > 2500) return evalBoard();
  if (depth === 0 || game.game_over()) return evalBoard();
  const moves = orderMoves(game.moves());
  if (isMax) {
    let best = -Infinity;
    for (const m of moves) {
      game.move(m); const s = minimax(depth-1,alpha,beta,false); game.undo();
      if (s > best) best = s;
      if (s > alpha) alpha = s;
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const m of moves) {
      game.move(m); const s = minimax(depth-1,alpha,beta,true); game.undo();
      if (s < best) best = s;
      if (s < beta) beta = s;
      if (beta <= alpha) break;
    }
    return best;
  }
}

function orderMoves(moves) {
  return moves.sort((a,b) => {
    let sa = 0, sb = 0;
    if (a.includes('x')) sa += 10; if (a.includes('+')) sa += 5; if (a.includes('=')) sa += 8;
    if (b.includes('x')) sb += 10; if (b.includes('+')) sb += 5; if (b.includes('=')) sb += 8;
    return sb - sa;
  });
}

function getBotMove() {
  const moves = game.moves({ verbose: true });
  if (!moves.length) return null;

  if (cfg.diff === 'easy') {
    const caps = moves.filter(m => m.flags.includes('c') || m.flags.includes('e'));
    if (caps.length && Math.random() < 0.35) return caps[Math.floor(Math.random()*caps.length)];
    return moves[Math.floor(Math.random()*moves.length)];
  }

  if (Math.random() < (cfg.diff==='normal' ? 0.08 : 0)) {
    return moves[Math.floor(Math.random()*moves.length)];
  }

  const depth = cfg.diff === 'normal' ? 3 : 5;
  searchStart = Date.now();
  const shuffle = [...moves].sort(() => Math.random()-.5);
  let bestMove = shuffle[0], bestScore = -Infinity;

  for (const m of shuffle) {
    game.move(m);
    const score = minimax(depth-1, -Infinity, Infinity, false);
    game.undo();
    if (score > bestScore) { bestScore = score; bestMove = m; }
  }
  return bestMove;
}

// ===== CLOCK =====
function startClockFor(color) {
  stopClock();
  updateClockUI();
  clockTick = setInterval(() => {
    clocks[color] -= 1;
    if (clocks[color] <= 0) {
      clocks[color] = 0;
      updateClockUI();
      stopClock();
      endGameByTime(color === 'w' ? 'Putih' : 'Hitam');
    } else {
      updateClockUI();
    }
  }, 1000);
}

function switchClock() {
  const next = game.turn();
  startClockFor(next);
}

function stopClock() {
  if (clockTick) { clearInterval(clockTick); clockTick = null; }
}

function addIncrementTo(color) {
  clocks[color] += cfg.inc;
}

function updateClockUI() {
  document.getElementById('clock-white').textContent = formatTime(clocks.w);
  document.getElementById('clock-black').textContent = formatTime(clocks.b);
  document.getElementById('clock-white').classList.toggle('low-time', clocks.w <= 30);
  document.getElementById('clock-black').classList.toggle('low-time', clocks.b <= 30);

  const turn = game.turn();
  document.getElementById('bar-white').classList.toggle('active-turn', turn==='w');
  document.getElementById('bar-black').classList.toggle('active-turn', turn==='b');
}

function formatTime(s) {
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = Math.max(0, s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

// ===== STATUS / MOVES =====
function updateStatus() {
  if (!game) return;
  const turn = game.turn() === 'w' ? 'Putih' : 'Hitam';
  document.getElementById('turn-badge').textContent = turn;

  let msg = `Giliran: ${turn}`;
  if (game.in_check()) msg += ' ⚠️ SKAK!';
  if (game.in_checkmate()) msg = `Skakmat! ${turn === 'Putih' ? 'Hitam' : 'Putih'} menang!`;
  else if (game.in_draw()) msg = 'Seri (Draw)!';
  document.getElementById('status-msg').textContent = msg;

  highlightCheck();
}

function renderMoves() {
  const hist = game.history({ verbose: true });
  const ml = document.getElementById('move-list');
  ml.innerHTML = '';
  for (let i = 0; i < hist.length; i += 2) {
    const num = Math.floor(i/2)+1;
    const w = hist[i];
    const b = hist[i+1];
    const numEl = document.createElement('div');
    numEl.className = 'move-num'; numEl.textContent = num+'.';
    ml.appendChild(numEl);

    const wEl = document.createElement('div');
    wEl.className = 'move-cell' + (i===hist.length-1 ? ' last-move' : '');
    wEl.textContent = w.san; ml.appendChild(wEl);

    const bEl = document.createElement('div');
    bEl.className = 'move-cell' + (b && i+1===hist.length-1 ? ' last-move' : '');
    bEl.textContent = b ? b.san : ''; ml.appendChild(bEl);
  }
  ml.scrollTop = ml.scrollHeight;
}

function updateAll() {
  board.position(game.fen());
  updateStatus();
  renderMoves();
  updateClockUI();
}

// ===== HIGHLIGHTS =====
function highlightMove(from, to) {
  removeHighlights();
  $(`[data-square="${from}"]`).addClass('highlight-from');
  $(`[data-square="${to}"]`).addClass('highlight-to');
}

function removeHighlights() {
  $('.square-55d63').removeClass('highlight-from highlight-to check-sq');
}

function clearHighlights() {
  $('.square-55d63').removeClass('highlight-from highlight-to check-sq');
}

function highlightCheck() {
  $('.square-55d63').removeClass('check-sq');
  if (game.in_check()) {
    const bd = game.board();
    const color = game.turn();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = bd[r][c];
        if (p && p.type === 'k' && p.color === color) {
          const file = String.fromCharCode(97+c);
          const rank = 8 - r;
          $(`[data-square="${file}${rank}"]`).addClass('check-sq');
        }
      }
    }
  }
}

// ===== GAME END =====
function endGame() {
  stopClock();
  gameActive = false;
  let title, desc;
  if (game.in_checkmate()) {
    const winner = game.turn() === 'w' ? 'Hitam' : 'Putih';
    title = `${winner} Menang! 🏆`;
    desc = 'Skakmat!';
  } else if (game.in_draw()) {
    title = 'Seri / Draw';
    desc = game.in_stalemate() ? 'Stalemate' : game.in_threefold_repetition() ? 'Pengulangan 3x' : game.insufficient_material() ? 'Material Tidak Cukup' : 'Draw';
  }
  showResult(title, desc);
}

function endGameByTime(loser) {
  gameActive = false;
  const winner = loser === 'Putih' ? 'Hitam' : 'Putih';
  showResult(`${winner} Menang! ⏱️`, `${loser} kehabisan waktu!`);
}

function showResult(title, desc) {
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-desc').textContent = desc;
  document.getElementById('result-overlay').classList.add('show');
}

function resign() {
  if (!gameActive) return;
  const resigner = game.turn() === 'w' ? 'Putih' : 'Hitam';
  const winner = resigner === 'Putih' ? 'Hitam' : 'Putih';
  stopClock();
  gameActive = false;
  showResult(`${winner} Menang! 🏆`, `${resigner} menyerah`);
}

// ===== CONTROLS =====
function undoMove() {
  if (!gameActive) return;
  if (botThinking) return;
  if (cfg.mode === 'bot') {
    game.undo(); game.undo();
  } else {
    game.undo();
  }
  removeHighlights();
  updateAll();
}

function newGame() {
  document.getElementById('result-overlay').classList.remove('show');
  initBoard();
}

function goMenu() {
  stopClock();
  gameActive = false;
  document.getElementById('result-overlay').classList.remove('show');
  document.getElementById('gamescreen').style.display = 'none';
  document.getElementById('pregame').style.display = 'flex';
}

`;
document.head.appendChild(style);

document.getElementById('diff-card').style.display = '';
</script>
